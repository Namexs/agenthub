# Gitleaks configuration (Phase 4).
#
# [extend] useDefault = true is ESSENTIAL: without it, this file
# REPLACES the default rule set (zero rules → zero findings, a silent
# false clean). With it, the default rules run and only the allowlist
# below narrows them. This was caught by a negative control test (a
# fake private key + ghp token must still be detected) — see
# CI_EVIDENCE.md §5.
[extend]
useDefault = true

# The ONLY allowlisted values are Foundry's PUBLIC Anvil dev keys
# (accounts 0/1/2, printed in every `anvil` startup banner and in the
# Foundry book) plus one MockERC20 token ADDRESS that the
# generic-api-key rule misfires on. They hold no real funds, are used
# only against a local anvil instance, and appear in test files, local
# deploy scripts, and their logs. The list is by EXACT VALUE, not by
# path — a real private key, API token, or mnemonic in any file must
# still fail the scan. Do NOT extend this allowlist without a written
# justification reviewed like a code change.
#
# The 0xac09…4f3ff80 entry is a TRANSCRIPTION TYPO of the account-0 key
# that lived in one old commit (fixed in the tree since); it is
# allowlisted because gitleaks scans full history.

title = "AGENTHUB gitleaks config"

[allowlist]
description = "Foundry Anvil dev keys (public, local-only) + one token-address false positive"
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f3ff80''',
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''0x5FC8d32690cc91D4c39d9d3abcBD16989F875707''',
]
