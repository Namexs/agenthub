name: CI

# NOTE: this repo has NO GitHub remote yet, so this workflow has NEVER
# run on GitHub. Every step below is verified locally instead — see
# agenthub-final-pretestnet/CI_EVIDENCE.md for the per-step commands,
# logs, and results. Do not claim "CI passed" until a remote exists and
# a real run is green.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# One run per branch at a time; a new push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned toolchains (single source of truth for every job).
# Phase G fix: NODE_VERSION was '20.17.6', which DOES NOT EXIST
# (the 20.17 line stops at 20.17.0 — verified against the nodejs.org
# dist index 2026-11-19). actions/setup-node would have failed every
# JS job on GitHub at the setup step. Pinned to 20.20.2, the latest
# Node 20 LTS patch at verification time.
env:
  NODE_VERSION: '20.20.2'
  PNPM_VERSION: '9.15.4'
  FOUNDRY_VERSION: '1.9.0'
  SLITHER_VERSION: '0.11.6'
  PYTHON_VERSION: '3.12'

jobs:
  web:
    name: Web (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agenthub/web lint
      - run: pnpm --filter @agenthub/web typecheck
      # Vitest: the full suite runs, including the 58 hook tests (jsdom).
      # The test deps (@testing-library/react, jsdom, playwright) are
      # declared in apps/web/package.json since Phase C of the final
      # release remediation — a missing dep fails loudly instead of
      # silently dropping the hook tests (the old graceful-skip
      # fallback is gone). See TEST_INFRASTRUCTURE_REPORT.md.
      - run: pnpm --filter @agenthub/web test
      - run: pnpm --filter @agenthub/web build
        env:
          NEXT_PUBLIC_CHAIN_ID: '97'

  shared:
    name: Shared (lint, typecheck, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agenthub/shared lint
      - run: pnpm --filter @agenthub/shared typecheck
      - run: pnpm --filter @agenthub/shared test

  format:
    name: Format check (prettier + forge fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: forge fmt --check
        working-directory: packages/contracts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Audit with a documented allowlist (Phase G). The 12 accepted
      # Next.js 14.2.35 findings (3 CRITICAL + 9 HIGH) are GONE — the
      # Next.js 15.5.29 upgrade removed every high/critical finding
      # from the tree, so the allowlist is currently EMPTY (see
      # agenthub-next15-upgrade/NEXT15_UPGRADE_REPORT.md). The
      # mechanism stays: the script fails ONLY on findings that are
      # NOT explicitly allowlisted — each entry names the advisory,
      # the package, and its justification. Allowlisted findings are
      # printed on every run; new high/critical findings, stale
      # allowlist entries, and audit errors all fail the job. The audit
      # is NOT weakened or deleted — it is scoped, visibly.
      - run: node scripts/pnpm-audit-allowlist.mjs

  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pinned to the exact toolchain used locally (M3): `stable` drifted
      # between runs and could change compiler behavior silently.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build
        working-directory: packages/contracts
      - run: forge test
        working-directory: packages/contracts

  fuzz:
    name: Contracts fuzz + invariant (10k runs, pinned seed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build
        working-directory: packages/contracts
      # The seed is pinned so a failure is reproducible: an
      # unreproduced transient failure (1 in ~13 runs, cause never
      # identified) was documented during the remediation — see
      # docs/REGRESSION_RESULTS.md §4.4. The main `contracts` job keeps
      # the default random seed for breadth.
      - run: forge test --fuzz-runs 10000 --fuzz-seed 42
        working-directory: packages/contracts

  slither:
    name: Slither static analysis (fail on Medium+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install slither-analyzer==${{ env.SLITHER_VERSION }}
      - run: forge build
        working-directory: packages/contracts
      # crytic-compile detects the Foundry project and reuses the forge
      # build, so no standalone solc is needed. --fail-medium matches
      # the project's bar (0 High/Medium); the 4 Low + 8 Info findings
      # are documented accepted risks — see FINAL_SECURITY_FINDINGS.md.
      - run: slither . --exclude-dependencies --fail-medium
        working-directory: packages/contracts

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the full history, not just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  manifest:
    name: Package manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # verify-manifest.sh reads the recorded commit's tree from
          # git history, so a shallow checkout cannot verify it.
          fetch-depth: 0
      # The manifest (PACKAGE_MANIFEST.md) describes a specific commit
      # and is committed separately from it, so HEAD is normally a
      # descendant of the recorded commit — the script handles that.
      # Regenerate after any content change:
      #   ./scripts/generate-manifest.sh <commit>
      - run: ./scripts/verify-manifest.sh
