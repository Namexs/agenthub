name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agenthub/web lint
      - run: pnpm --filter @agenthub/web typecheck
      - run: pnpm --filter @agenthub/web build
        env:
          NEXT_PUBLIC_CHAIN_ID: '97'

  shared:
    name: Shared (lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agenthub/shared lint
      - run: pnpm --filter @agenthub/shared typecheck

  format:
    name: Format check (prettier + forge fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: forge fmt --check
        working-directory: packages/contracts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs on GitHub runners (the dev VM's registry returns 403 for the
      # audit endpoint — see PHASE1_AUDIT.md L9 — so this cannot be
      # verified locally; a failing audit blocks the merge here instead).
      - run: pnpm audit --audit-level=high

  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pinned to the exact toolchain used locally (M3): `stable` drifted
      # between runs and could change compiler behavior silently.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.9.0
      - run: forge build
        working-directory: packages/contracts
      - run: forge test
        working-directory: packages/contracts
