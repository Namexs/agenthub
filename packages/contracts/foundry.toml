[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# FINAL REMEDIATION (Phase 7): the local test-stack script writes its
# deployment JSON into the project root. Scoped to that one file — the
# script cannot write anywhere else.
fs_permissions = [{ access = "read-write", path = "./.anvil-deployment.json" }]
# M2 fix (Phase 1 audit): pin the EVM version explicitly. "cancun" matches
# the solc 0.8.24 default. Our contracts use no transient storage and no
# Cancun-only opcodes (OZ 5.0.2 ReentrancyGuard is storage-based — verified
# from source), so this is a reproducibility pin, not a feature dependency.
# Cancun-opcode support on BSC must still be smoke-tested on testnet before
# any mainnet deploy (see SECURITY_DEPLOYMENT_GATE.md).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@agenthub/=src/",
]
# Etherscan / BscScan verification (Phase H): foundry does NOT read
# BSCSCAN_API_KEY — `forge script --verify` and `forge verify-contract`
# look for ETHERSCAN_API_KEY (verified 2026-11-19: with only
# BSCSCAN_API_KEY set, --verifier etherscan fails with
# "ETHERSCAN_API_KEY must be set"). This section maps the repo's
# documented BSCSCAN_API_KEY env var onto both BSC chains, so the
# operator sets ONE variable (see .env.example). The value is an env
# interpolation — no key material lives in this file.
[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}" }
bsc-testnet = { key = "${BSCSCAN_API_KEY}" }

# Fuzz + invariant defaults (Phase 1 smoke tests use these; Phase 2 expands).
[fuzz]
runs = 256
max_test_rejects = 65536
[invariant]
runs = 256
depth = 128
fail_on_revert = true
