[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@agenthub/=src/",
]
# Fuzz + invariant defaults (Phase 1 smoke tests use these; Phase 2 expands).
[fuzz]
runs = 256
max_test_rejects = 65536
[invariant]
runs = 256
depth = 128
fail_on_revert = true
